[general]
base_dir = /data/work/pmt
data_dir = %(base_dir)s/data
tools_dir = %(base_dir)s/tools

[youtube]
# Maximum number of videos to fetch per playlist
max_videos_per_playlist = 50

# Delay between requests to avoid rate limiting (seconds)
request_delay = 1

[ustaz]
# Ustaz directories
qarni_dir = %(base_dir)s/ustaz/qarni
fadzil_dir = %(base_dir)s/ustaz/fadzil
halim_dir = %(base_dir)s/ustaz/halim
adli_dir = %(base_dir)s/ustaz/adli

[playlists]
# Qarni playlists
qarni_1000_amalan_sunnah = https://www.youtube.com/playlist?list=PLv_xoi4FGsu8Y2CuKhUoRId0szziOz9He
qarni_bacaan_pelik_ganjil = https://www.youtube.com/playlist?list=PLv_xoi4FGsu_VrsuNVH8VqQVbxYLt22wc
qarni_30_teknik_tadabbur = https://www.youtube.com/playlist?list=PLv_xoi4FGsu_OrjOhwUltHg927qCs5U-1

# Fadzil playlists
fadzil_tafsir_al_quran = https://www.youtube.com/playlist?list=PLv_xoi4FGsu-NAfJmPOVrMWUxvbi6HC8X

# Halim playlists
halim_perubatan_tradisional = https://www.youtube.com/playlist?list=PLv_xoi4FGsu8vaDF8BN63grv7fOAiu4XI

# Adli playlists
adli_aqidah_islam_manhaj_salaf = https://www.youtube.com/playlist?list=PLv_xoi4FGsu_B05TVWrh0sd3cfsOlaE4o

[output]
# Output formats
json_indent = 2
html_template = default

[file_naming]
# File naming conventions
metadata_suffix = _metadata
video_file_pattern = {index:02d}_{video_id}
html_embed_suffix = _embedded